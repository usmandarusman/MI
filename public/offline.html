
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />

  <title>Offline | Mann's Intelligence</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #09090b;
      color: #fafafa;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 360px;
    }

    img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 23px;
      margin: 0 0 12px;
    }

    p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.7;
    }

    button {
      margin-top: 16px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #eab308;
      color: #18181b;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/icon-192.png" alt="Mann's Intelligence" />

    <h1>Kamu sedang offline</h1>

    <p>
      Koneksi internet terputus. Mann's Intelligence
      akan bisa diakses kembali setelah koneksi pulih.
    </p>

    <button onclick="location.reload()">
      Coba Lagi
    </button>
  </div>
</body>
</html>
